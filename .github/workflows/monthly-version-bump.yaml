name: Monthly version bump

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute new version strings
        id: ver
        run: |
          year_full=$(date +%Y)
          year_short=$(date +%y)
          month_num=$(date +%-m)
          month_abbr=$(date +%b)

          version="${year_short}.${month_num}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "year_full=$year_full" >> "$GITHUB_OUTPUT"
          echo "month_abbr=$month_abbr" >> "$GITHUB_OUTPUT"

      - name: Update os-release
        run: |
          sed -i \
            -e "s/^VARIANT=.*/VARIANT=\"Release Build ${{ steps.ver.outputs.month_abbr }}. ${{ steps.ver.outputs.year_full }}\"/" \
            -e "s/^VERSION=.*/VERSION=\"${{ steps.ver.outputs.version }}\"/" \
            -e "s/^IMAGE_VERSION=.*/IMAGE_VERSION=${{ steps.ver.outputs.version }}/" \
            os-release

      - name: Update pearos-release
        run: echo "${{ steps.ver.outputs.version }}" > pearos-release

      - name: Update lsb-release
        run: |
          sed -i \
            -e "s/^DISTRIB_RELEASE=.*/DISTRIB_RELEASE=${{ steps.ver.outputs.version }}/" \
            lsb-release

      - name: Bump filesystem PKGBUILD pkgver
        run: |
          sed -i "s/^pkgver=.*/pkgver=$(date +%Y.%m.%d)/;s/^pkgrel=.*/pkgrel=1/" PKGBUILD

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add os-release pearos-release lsb-release PKGBUILD
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: bump release to ${{ steps.ver.outputs.version }}"
          git push
